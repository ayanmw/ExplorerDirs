name: Bug report
description: Report a reproducible Explorer Dirs problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Explorer Dirs commit or version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include layout, tab count, and path type. Remove private path and file names.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
